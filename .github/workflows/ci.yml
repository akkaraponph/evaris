name: Go checks
# Check changes to dev and main, and verify the merged release branch.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: go-checks-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as the source of release PRs
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && (github.head_ref != 'dev' || github.event.pull_request.head.repo.full_name != github.repository) }}
        run: |
          echo '::error::Open feature PRs against dev and promote dev to main.'
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Format
        run: test -z "$(gofmt -l cmd internal examples)"
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - name: Offline application acceptance
        env:
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOSUMDB: "off"
        run: go test ./internal/acceptance -count=1

  # Exercise the latest tested Invaris release. Older compatibility checks can
  # run locally with EVARIS_TEST_INVARIS.
  invaris:
    runs-on: ubuntu-latest
    env:
      INVARIS_REF: v0.5.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: refactorroom/invaris
          ref: ${{ env.INVARIS_REF }}
          path: invaris-src
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the pinned Invaris release
        working-directory: invaris-src
        run: |
          go build -trimpath -ldflags "-X github.com/akkaraponph/invaris/internal/engine.releaseVersion=$INVARIS_REF" \
            -o "$RUNNER_TEMP/invaris" ./cmd/invaris
          test "$("$RUNNER_TEMP/invaris" --version)" = "invaris $INVARIS_REF"
      - name: Real Invaris contract and P1 integration (offline)
        env:
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOSUMDB: "off"
        run: |
          export EVARIS_TEST_INVARIS="$RUNNER_TEMP/invaris"
          go test ./internal/adapters/invaris ./internal/acceptance \
            -run 'TestRealInvaris$|TestP1OfflineIntegration$|TestRealInvarisCampaign' -count=1 -v
