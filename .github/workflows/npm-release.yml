name: Publish npm package
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  publish:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@49933edd5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Verify tag and release CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test -z "$(git status --porcelain)"
          commit=$(git rev-parse HEAD)
          gh run list --workflow ci.yml --commit "$commit" --json status,conclusion --limit 100 | jq -e 'any(.[]; .status == "completed" and .conclusion == "success")'
          node --test npm/evaris/test/*.test.js
      - name: Build and package release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$RELEASE_TAG" -o "dist/evaris-$RELEASE_TAG-${target%/*}-${target#*/}" ./cmd/evaris
          done
          (cd dist && sha256sum evaris-* > SHA256SUMS)
          test "$(dist/evaris-$RELEASE_TAG-linux-amd64 --version)" = "evaris $RELEASE_TAG"
          node scripts/package-npm.js "$RELEASE_TAG" dist
          npm install --global --prefix "$RUNNER_TEMP/evaris-test" "dist/evaris-cli-${RELEASE_TAG#v}.tgz"
          test "$("$RUNNER_TEMP/evaris-test/bin/evaris" --version)" = "evaris $RELEASE_TAG"
          "$RUNNER_TEMP/evaris-test/bin/evaris" validate --experiment testdata/valid/experiment.json
      - name: Publish with npm trusted publishing
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm publish "dist/evaris-cli-${RELEASE_TAG#v}.tgz" --access public
